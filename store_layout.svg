<svg width="850.0" height="1040.0" xmlns="http://www.w3.org/2000/svg" style="background-color: #f4f4f4; font-family: Arial, sans-serif;">

    <!-- Контур зала -->
    <rect x="40" y="40" width="700.0" height="900.0" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>

    <!-- Колонна -->
    <rect x="290.0" y="490.0" width="90.0" height="90.0" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
    <text x="305.0" y="540.0" font-size="16" font-weight="bold" fill="#fff">Колонна</text>
    <text x="310.0" y="560.0" font-size="12" fill="#fff">90x90</text>

    <!-- Входная дверь -->
    <rect x="40.0" y="940.0" width="100.0" height="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <line x1="90.0" y1="940.0" x2="90.0" y2="952.0" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60.0" y="980.0" font-size="18" font-weight="bold" fill="#2c3e50">ВХОД (1м)</text>

    <!-- Окно -->
    <rect x="140.0" y="936.0" width="480.0" height="8" fill="#e0f7fa" stroke="#00838f" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="240.0" y="980.0" font-size="16" font-weight="bold" fill="#2c3e50">ОКНО (4.8м)</text>

    <!-- Правый простенок -->
    <rect x="620.0" y="932.0" width="120.00000000000001" height="16" fill="#bdc3c7" stroke="#2c3e50" stroke-width="2"/>
    <text x="640.0" y="980.0" font-size="14" fill="#2c3e50">ПРОСТЕНОК (1.2м)</text>

    <!-- Ресепшн -->
    <rect x="680.0" y="440.0" width="60.0" height="280.0" fill="#f8c471" stroke="#d35400" stroke-width="2"/>
    <text x="600.0" y="480.0" font-size="16" font-weight="bold" fill="#2c3e50">Ресепшн (Касса)</text>
    <text x="620.0" y="500.0" font-size="12" fill="#2c3e50">(Начало от входа 4м)</text>

    <!-- Задняя стена -->
    <!-- Простенок справа -->
    <rect x="660.0" y="40" width="80.0" height="12" fill="#bdc3c7" stroke="#2c3e50" stroke-width="2"/>
    <text x="670.0" y="70" font-size="12" fill="#2c3e50">Простенок 0.8м</text>

    <!-- Белая дверь (Тех. кабинет) -->
    <rect x="570.0" y="40" width="90.0" height="12" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <text x="560.0" y="70" font-size="14" font-weight="bold" fill="#2c3e50">Тех. кабинет</text>

    <!-- Витрина между дверьми -->
    <rect x="440.0" y="40" width="130.0" height="12" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
    <text x="450.0" y="70" font-size="12" fill="#2c3e50">Витрина 1.3м</text>

    <!-- Фиолетовая дверь (Склад) -->
    <rect x="350.0" y="40" width="90.0" height="12" fill="#d2b4de" stroke="#8e44ad" stroke-width="2"/>
    <text x="340.0" y="70" font-size="14" font-weight="bold" fill="#2c3e50">Склад</text>

    <!-- Размеры стен -->
    <text x="370.0" y="1020.0" font-size="18" font-weight="bold" fill="#2c3e50">7 м</text>
    <text x="790.0" y="495.0" font-size="18" font-weight="bold" fill="#2c3e50" transform="rotate(90, 790.0, 495.0)">9 м</text>
</svg>
